schema_version: "1.1"
name: no-invented-text-props
expected_outcome: |
  A 4–6 cut 分鏡腳本 that carries the hesitation and the landlord's watching through blocking, eyelines,
  timing and the items already given (iron door, doorbell, peephole, stairs, tote bag). No new plot-bearing
  prop appears, and especially no text-bearing one such as a notice, sign, letter, paper strip or nameplate
  (the user's correction after an invented 「吉屋出租」 notice).
