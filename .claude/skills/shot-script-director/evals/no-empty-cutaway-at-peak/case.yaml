schema_version: "1.1"
name: no-empty-cutaway-at-peak
expected_outcome: |
  A 4–6 cut 分鏡腳本 in Traditional Chinese in which every cut has the mother or her own action on screen.
  The weight after the phone call lands by holding or delaying the cut inside working cuts, never by cutting
  to an empty kitchen, window, corridor, dripping tap or an object on its own (the user's 呼吸鏡 correction).
